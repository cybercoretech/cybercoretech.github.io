<svg data-cc-asset="project-cyberdesk" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="cyberdesk">
  <defs>
    <filter id="project-cyberdesk-neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="project-cyberdesk-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--cc-brand-hot-pink, #ff2d9e)"/>
      <stop offset="1" style="stop-color:var(--cc-brand-purple, #b57bff)"/>
    </linearGradient>
  </defs>

  <!-- rotated 3x3 sub-grid, echoing the ◈ brand glyph -->
  <g transform="rotate(45 128 128)" filter="url(#project-cyberdesk-neon)">
    <g stroke-width="7" stroke-linejoin="round" style="fill:var(--cc-brand-bg, #0a0d16)">
      <!-- corners: acid -->
      <rect x="50"  y="50"  width="44" height="44" rx="8" style="stroke:var(--cc-brand-acid-green, #c6ff45)"/>
      <rect x="162" y="50"  width="44" height="44" rx="8" style="stroke:var(--cc-brand-acid-green, #c6ff45)"/>
      <rect x="50"  y="162" width="44" height="44" rx="8" style="stroke:var(--cc-brand-acid-green, #c6ff45)"/>
      <rect x="162" y="162" width="44" height="44" rx="8" style="stroke:var(--cc-brand-acid-green, #c6ff45)"/>
      <!-- edges: cyan -->
      <rect x="106" y="50"  width="44" height="44" rx="8" style="stroke:var(--cc-brand-cyan, #22e6ff)"/>
      <rect x="50"  y="106" width="44" height="44" rx="8" style="stroke:var(--cc-brand-cyan, #22e6ff)"/>
      <rect x="162" y="106" width="44" height="44" rx="8" style="stroke:var(--cc-brand-cyan, #22e6ff)"/>
      <rect x="106" y="162" width="44" height="44" rx="8" style="stroke:var(--cc-brand-cyan, #22e6ff)"/>
    </g>
    <!-- core: the "desk" / cursor -->
    <rect x="106" y="106" width="44" height="44" rx="8" fill="url(#project-cyberdesk-core)"/>
    <rect x="120" y="120" width="16" height="16" rx="3" style="fill:var(--cc-brand-bg, #06080f)"/>
  </g>
</svg>
