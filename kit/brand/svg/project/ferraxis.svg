<svg data-cc-asset="project-ferraxis" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="project-ferraxis-title project-ferraxis-desc">
  <title id="project-ferraxis-title">Ferraxis mark</title>
  <desc id="project-ferraxis-desc">Three forged plates converge around an ember core.</desc>
  <defs>
    <linearGradient id="project-ferraxis-iron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--cc-brand-white, #e2e8e9)"/>
      <stop offset=".28" stop-color="#667477"/>
      <stop offset="1" style="stop-color:var(--cc-brand-bg, #131a1d)"/>
    </linearGradient>
    <linearGradient id="project-ferraxis-copper" x1="0" y1="1" x2="1" y2="0">
      <stop style="stop-color:var(--cc-brand-orange, #ff6c2f)"/>
      <stop offset=".55" stop-color="#ffae4a"/>
      <stop offset="1" stop-color="#ffe7a1"/>
    </linearGradient>
    <filter id="project-ferraxis-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="54" style="fill:var(--cc-brand-bg, #090d0f)"/>
  <circle cx="128" cy="128" r="94" fill="none" stroke-width="2" style="stroke:var(--cc-brand-line, #2d3b3d)"/>
  <circle cx="128" cy="128" r="78" fill="none" stroke-width="1" stroke-dasharray="3 8" style="stroke:var(--cc-brand-bg, #162124)"/>
  <path d="M128 34 201 75v36l-73 42-73-42V75z" stroke-width="3" style="fill:var(--cc-brand-bg, #11191b);stroke:var(--cc-brand-line, #334346)"/>
  <path d="m128 42 57 33-57 33-57-33z" fill="url(#project-ferraxis-iron)" stroke-width="3" style="stroke:var(--cc-brand-muted, #9fa9a9)"/>
  <path d="m71 85 57 33v72l-57-33z" fill="url(#project-ferraxis-copper)" stroke="#ff8841" stroke-width="3"/>
  <path d="m185 85-57 33v72l57-33z" fill="url(#project-ferraxis-iron)" stroke-width="3" style="stroke:var(--cc-brand-cyan, #46d5ed)"/>
  <path d="m128 101 24 14v28l-24 14-24-14v-28z" opacity=".9" filter="url(#project-ferraxis-glow)" style="fill:var(--cc-brand-orange, #ff7330)"/>
  <path d="m128 108 17 10v19l-17 10-17-10v-19z" fill="url(#project-ferraxis-copper)" stroke="#fff0b7" stroke-width="2"/>
</svg>
