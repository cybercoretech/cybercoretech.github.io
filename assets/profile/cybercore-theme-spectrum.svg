<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="250" viewBox="0 0 1600 250" role="img" aria-labelledby="title desc">
  <title id="title">Cybercore Tech theme matrix</title>
  <desc id="desc">Seven clickable Cybercore theme families containing 81 palettes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101b"/><stop offset=".5" stop-color="#111027"/><stop offset="1" stop-color="#210d22"/></linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#12e5de"/><stop offset=".2" stop-color="#7cff4f"/><stop offset=".4" stop-color="#b6ff3c"/><stop offset=".6" stop-color="#ff6a1a"/><stop offset=".8" stop-color="#ff2158"/><stop offset="1" stop-color="#b44dff"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#94b9d0" stroke-opacity=".09"/></pattern>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}
      .family{font-size:17px;font-weight:700;letter-spacing:2px;fill:#f5f3ff}
      .count{font-size:12px;letter-spacing:2px;fill:#9aaac0}
      .node:hover{filter:url(#glow)}
    </style>
  </defs>
  <rect x="8" y="8" width="1584" height="234" rx="26" fill="url(#bg)" stroke="#23485a" stroke-width="2"/>
  <rect x="26" y="26" width="1548" height="198" rx="18" fill="url(#grid)"/>
  <text x="58" y="64" font-size="16" letter-spacing="5" fill="#12e5de">THEME MATRIX // CYBERCORE PALETTE ENGINE</text>
  <text x="1542" y="64" text-anchor="end" font-size="13" letter-spacing="3" fill="#8298ad">81 PALETTES / 07 FAMILIES</text>
  <path d="M58 86H1542" stroke="url(#spectrum)" stroke-width="2"/>
  <a class="node" href="https://cybercoretech.github.io/?theme=cyberdyne-assassin"><g transform="translate(58 112)"><rect width="200" height="68" rx="12" fill="#0d2429" stroke="#12e5de"/><text x="18" y="29" class="family">CYBERDYNE</text><text x="18" y="50" class="count">12 PALETTES ↗</text></g></a>
  <a class="node" href="https://cybercoretech.github.io/?theme=cyberpunk-alley"><g transform="translate(273 112)"><rect width="200" height="68" rx="12" fill="#172218" stroke="#7cff4f"/><text x="18" y="29" class="family">CYBERPUNK</text><text x="18" y="50" class="count">12 PALETTES ↗</text></g></a>
  <a class="node" href="https://cybercoretech.github.io/?theme=catppuccin-mocha"><g transform="translate(488 112)"><rect width="200" height="68" rx="12" fill="#1b2116" stroke="#b6ff3c"/><text x="18" y="29" class="family">DEFAULT</text><text x="18" y="50" class="count">12 PALETTES ↗</text></g></a>
  <a class="node" href="https://cybercoretech.github.io/?theme=dystopian-ash"><g transform="translate(703 112)"><rect width="200" height="68" rx="12" fill="#251b12" stroke="#ff6a1a"/><text x="18" y="29" class="family">DYSTOPIAN</text><text x="18" y="50" class="count">12 PALETTES ↗</text></g></a>
  <a class="node" href="https://cybercoretech.github.io/?theme=neosynth-beam"><g transform="translate(918 112)"><rect width="200" height="68" rx="12" fill="#28131c" stroke="#ff2158"/><text x="18" y="29" class="family">NEOSYNTH</text><text x="18" y="50" class="count">12 PALETTES ↗</text></g></a>
  <a class="node" href="https://cybercoretech.github.io/?theme=synthwave-arcade"><g transform="translate(1133 112)"><rect width="200" height="68" rx="12" fill="#21132b" stroke="#b44dff"/><text x="18" y="29" class="family">SYNTHWAVE</text><text x="18" y="50" class="count">12 PALETTES ↗</text></g></a>
  <a class="node" href="https://cybercoretech.github.io/?theme=blackbox-industrial"><g transform="translate(1348 112)"><rect width="200" height="68" rx="12" fill="#1c2119" stroke="#c8e967"/><text x="13" y="29" class="family" font-size="13">OMARCHY LIVE</text><text x="18" y="50" class="count">9 PALETTES ↗</text></g></a>
  <text x="800" y="212" text-anchor="middle" font-size="12" letter-spacing="3" fill="#8298ad">SELECT A FAMILY TO ENTER THE THEME SURFACE</text>
</svg>
